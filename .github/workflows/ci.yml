name: CI

on:
  pull_request:
    branches:
      - main
      - build/pilot-hardening
  push:
    branches:
      - main
      - build/pilot-hardening
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # PR jobs receive no staging or production credentials.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.12'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: npm ci
        timeout-minutes: 10
      - name: Check patch formatting
        run: git diff --check HEAD^ HEAD
      - name: Scan tracked files
        run: python3 scripts/scan-secrets.py --tracked
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        timeout-minutes: 15
      - name: Dependency audit report
        run: npm audit --omit=dev
        continue-on-error: true
        timeout-minutes: 5
      - name: Check application
        run: npm run check
        timeout-minutes: 10
      - name: Build application
        run: npm run build
        timeout-minutes: 10
      # The Playwright webServer wrapper owns Supabase start, reset, and teardown.
      - name: Run Playwright tests
        run: npm test
        timeout-minutes: 30
      - name: Scan generated client and server bundles
        run: python3 scripts/scan-secrets.py --bundles dist
        timeout-minutes: 5

  history-scan:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # This more expensive full-history scan is scheduled/manual, not PR-blocking.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'
      - name: Scan reachable Git history
        run: python3 scripts/scan-secrets.py --history
        timeout-minutes: 15
